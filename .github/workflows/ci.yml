name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instala as dependências (venv + panel/lib + worker/lib)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python setup_envs.py
          python -m pip install -r requirements/dev.txt

      - name: Confere o ambiente
        run: .venv/bin/python scripts/check_environment.py

      - name: Testes
        run: .venv/bin/python -m unittest discover -s tests

      - name: CSS do painel atualizado
        run: .venv/bin/python scripts/build_web_css.py --check

      - name: Lint do código de produção
        run: .venv/bin/python -m ruff check panel engine worker ipc_protocol.py presence_protocol.py tracker_protocol.py setup_envs.py

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t madman:ci .

      - name: Sobe só o painel web e confere /api/health
        run: |
          docker run -d --name madman -e WEB_ONLY=1 -e PORT=8080 -p 8080:8080 madman:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health

      - name: Desliga limpo com SIGTERM (como no deploy do Render)
        run: |
          docker stop --time 20 madman
          docker logs madman
          test "$(docker inspect -f '{{.State.ExitCode}}' madman)" = "0"

  dependencias:
    name: Vulnerabilidades conhecidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install pip-audit

      # Só avisa: uma CVE nova numa dependência não deve travar o deploy sozinha.
      - name: pip-audit
        continue-on-error: true
        run: |
          for file in requirements/base.txt requirements/panel.txt requirements/worker.txt; do
            echo "== $file"
            pip-audit --disable-pip --no-deps -r "$file" || echo "::warning file=$file::pip-audit encontrou vulnerabilidades em $file"
          done
